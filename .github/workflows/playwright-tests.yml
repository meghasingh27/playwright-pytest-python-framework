name: Playwright Tests

on:
  push:
    branches:
      - main
      - ci/github-actions

jobs:
  playwright-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"