name: Playwright Automation Tests

on:
  push:
    branches:
      - main
      - ci/github-actions

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:

      browser:
        description: "Select Browser"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      environment:
        description: "Select Environment"
        required: true
        default: QA
        type: choice
        options:
          - QA
          - UAT
          - STAGE

      headless:
        description: "Run Headless?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      marker:
        description: "Select Test Suite"
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression

jobs:

  playwright-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install
          playwright install-deps

      - name: Execute Tests
        shell: bash
        run: |
          BROWSER="${{ github.event.inputs.browser }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          MARKER="${{ github.event.inputs.marker }}"

          [[ -z "$BROWSER" ]] && BROWSER="chromium"
          [[ -z "$ENVIRONMENT" ]] && ENVIRONMENT="QA"

          CMD="pytest --browser=$BROWSER --env=$ENVIRONMENT --headless"

          if [[ -n "$MARKER" && "$MARKER" != "all" ]]; then
            CMD="$CMD -m $MARKER"
          fi

          # Only remove --headless if user explicitly selected false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.headless }}" == "false" ]]; then
            CMD="pytest --browser=$BROWSER --env=$ENVIRONMENT"

            if [[ -n "$MARKER" && "$MARKER" != "all" ]]; then
              CMD="$CMD -m $MARKER"
            fi
          fi

          echo "Running: $CMD"

          eval "$CMD"
          
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Report
          path: reports/

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/